name: ETL Pipeline CI/CD

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - '.env*'
      - 'data/**'
      - 'airflow_home/**'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  DBT_PROJECT_DIR: transform
  PIP_CACHE_DIR: ~/.cache/pip

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy types-python-dateutil types-requests
          pip install -r requirements.txt

      - name: Ruff lint
        run: ruff check . --ignore-path .gitignore --ignore=E501,F401

      - name: mypy type check
        run: mypy etl_pipeline.py dags/ src/ --ignore-missing-imports --follow-imports=skip

      - name: Python syntax check
        run: |
          for f in etl_pipeline.py dags/data_pipeline_dag.py src/*.py src/**/*.py; do
            [ -f "$f" ] && python -m py_compile "$f" && echo "OK: $f" || echo "FAIL: $f"
          done

  test:
    name: Test
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run ETL pipeline (mock mode)
        run: python etl_pipeline.py
        env:
          USE_MOCK: 'true'
          STORAGE_MODE: local

  docker:
    name: Docker Build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: dataforge-etl:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  dbt:
    name: dbt Validate
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dbt
        run: |
          pip install dbt-core dbt-bigquery

      - name: dbt parse (syntax check)
        run: |
          cd ${{ env.DBT_PROJECT_DIR }}
          dbt parse --profiles-dir .

  docker-compose:
    name: Docker Compose
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose config
