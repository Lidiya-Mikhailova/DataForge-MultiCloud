name: DataForge ETL CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - '.env*'
      - 'data/**'
      - 'airflow_home/**'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  DBT_PROJECT_DIR: transform


jobs:
  fast-ci:
    name: Fast CI (Lint + Type + Tests)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest types-requests types-python-dateutil
          pip install -r requirements.txt

      - name: Ruff lint
        run: ruff check .

      - name: MyPy type check
        run: mypy etl_pipeline.py dags src --ignore-missing-imports

      - name: Compile Python files
        run: |
          find etl_pipeline.py dags src -name "*.py" -exec python -m py_compile {} \;

      - name: Run unit tests
        run: pytest tests -v


  build:
    name: Docker Build Validation
    needs: fast-ci
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check Dockerfile
        run: test -f Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: dataforge-etl:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max


  dbt:
    name: dbt Validation (Parse + Compile)
    needs: fast-ci
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dbt
        run: pip install dbt-core dbt-bigquery

      - name: dbt parse
        run: |
          cd ${{ env.DBT_PROJECT_DIR }}
          dbt parse --profiles-dir .


  integration:
    name: Integration Checks
    needs: [build, dbt]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose
        run: docker compose config

      - name: Run ETL mock
        run: python etl_pipeline.py
        env:
          USE_MOCK: "true"
          STORAGE_MODE: local


